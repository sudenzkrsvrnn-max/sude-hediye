<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WhatsApp / Instagram / SMS Preview Tags -->
    <title>Sana Özel Bir Süpriz Var! 💝</title>
    <meta name="description" content="Senin için hazırlanan bu özel sürprizi görmek için QR kodu tara veya linke tıkla.">
    <meta property="og:title" content="Sana Özel Bir Süpriz Var! 💝">
    <meta property="og:description" content="Senin için hazırlanan bu özel sürprizi görmek için QR kodu tara veya linke tıkla.">
    <meta property="og:image" content="https://sudenzkrsvrnn-max.github.io/sude-hediye/og-preview.png">
    <meta property="og:type" content="website">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --primary: #ff1493;
            --accent: #ff0000;
            --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --wa: #25D366;
            --sms: #0a84ff;
            --ig-from: #f09433;
            --ig-to: #bc1888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
            gap: 30px;
            padding: 20px;
        }

        /* Background Glow */
        .bg-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255, 20, 147, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        /* Gift Box Container */
        .gift-container {
            position: relative;
            width: min(90vw, 420px);
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px;
            box-shadow: 0 30px 100px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            animation: containerFloat 6s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-15px) rotateX(4deg); }
        }

        /* Red Ribbon Overlay */
        .ribbon-vertical {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 100%;
            background: linear-gradient(to bottom, #d40000, #ff0000, #d40000);
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            z-index: 1;
        }

        .ribbon-horizontal {
            position: absolute;
            left: 0;
            top: 20%;
            width: 100%;
            height: 44px;
            background: linear-gradient(to right, #d40000, #ff0000, #d40000);
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            z-index: 1;
        }

        .bow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            z-index: 5;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* QR Area */
        .qr-wrapper {
            position: relative;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 16px;
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.2);
            margin-top: 36px;
        }

        #qr-canvas {
            display: block;
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.6));
        }

        .gift-title {
            position: relative;
            z-index: 10;
            margin-top: 22px;
            font-size: 21px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gift-desc {
            position: relative;
            z-index: 10;
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            text-align: center;
        }

        /* Signature */
        .signature {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 18px;
            opacity: 0.8;
        }

        .signature span {
            display: block;
            font-size: 9px;
            font-family: 'Outfit', sans-serif;
            font-style: normal;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
        }

        /* ── Share Buttons Panel ── */
        .share-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: min(90vw, 420px);
            z-index: 100;
        }

        .share-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 13px 18px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            font-family: 'Outfit', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .btn:hover  { transform: translateY(-2px); opacity: 0.92; }
        .btn:active { transform: scale(0.97); }

        .btn-wa {
            background: var(--wa);
            color: #fff;
            box-shadow: 0 4px 20px rgba(37,211,102,0.35);
        }
        .btn-sms {
            background: var(--sms);
            color: #fff;
            box-shadow: 0 4px 20px rgba(10,132,255,0.35);
        }
        .btn-ig {
            background: linear-gradient(135deg, var(--ig-from), var(--ig-to));
            color: #fff;
            box-shadow: 0 4px 20px rgba(188,24,136,0.35);
        }
        .btn-copy {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: none;
        }
        .btn-copy.copied {
            background: rgba(0,200,100,0.2);
            border-color: rgba(0,200,100,0.5);
            color: #44cc88;
        }
        .btn-open {
            background: linear-gradient(135deg, #cc0000, #ff2200);
            color: #fff;
            box-shadow: 0 4px 24px rgba(200,0,0,0.4);
            grid-column: 1 / -1;
            font-size: 15px;
            padding: 15px 18px;
        }

        #qr-hidden { display: none; }

    </style>
    <!-- Apple Emojis -->
    <script src="https://unpkg.com/twemoji@14.0.2/dist/twemoji.min.js"></script>
    <script>
        function applyAppleEmojis() {
            if (typeof twemoji !== 'undefined') {
                twemoji.parse(document.body, {
                    base: 'https://unpkg.com/emoji-datasource-apple@15.0.1/img/apple/',
                    ext: '.png'
                });
            }
        }
        document.addEventListener("DOMContentLoaded", function() {
            applyAppleEmojis();
            let timeout;
            const observer = new MutationObserver(() => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    observer.disconnect();
                    applyAppleEmojis();
                    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
                }, 100);
            });
            observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
    </script>
    <style>
        img.emoji { height: 1.2em; width: 1.2em; margin: 0 .05em 0 .1em; vertical-align: -0.1em; pointer-events: none; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="gift-container">
        <div class="ribbon-vertical"></div>
        <div class="ribbon-horizontal"></div>
        
        <img src="https://ymkfyaurdgfvdhkkpqam.supabase.co/storage/v1/object/public/assets/bow.png" class="bow" alt="Bow" onerror="this.src='https://pngimg.com/uploads/red_ribbon/red_ribbon_PNG8114.png'">

        <div class="qr-wrapper">
            <canvas id="qr-canvas"></canvas>
        </div>

        <h1 class="gift-title">Sana Özel Bir Süpriz Var</h1>
        <p class="gift-desc">QR kodu tara ya da butona tıkla ✨</p>

        <div class="signature">
            Gift<span>by Gülümse Diye</span>
        </div>
    </div>

    <!-- ── Share Panel ── -->
    <div class="share-panel">
        <!-- Open gift button -->
        <a href="#" id="open-link" class="btn btn-open">🎁 Hediyeyi Aç</a>

        <!-- Social share row -->
        <div class="share-row">
            <a href="#" id="share-wa"  class="btn btn-wa"  target="_blank">
                <!-- WhatsApp SVG icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                WhatsApp
            </a>
            <a href="#" id="share-sms" class="btn btn-sms">
                <!-- SMS / message bubble -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
                SMS
            </a>
        </div>

        <div class="share-row">
            <a href="#" id="share-ig" class="btn btn-ig">
                <!-- Instagram camera icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                IG için Kopyala
            </a>
            <button onclick="copyLink(this)" id="btn-copy" class="btn btn-copy">
                📋 Linki Kopyala
            </button>
        </div>
    </div>

    <div id="qr-hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // ── Determine URLs ────────────────────────────────────────────────
        const urlParams   = new URLSearchParams(window.location.search);
        const giftId      = urlParams.get('id') || 'demo';

        // Always point to the Vercel API so OG tags work
        const VERCEL_BASE = 'https://sude-hediye-cfhmqnvrg-sudenzkrsvrnn-maxs-projects.vercel.app';

        // The link we share on WhatsApp / SMS / IG — Vercel preview page
        const shareUrl = `${VERCEL_BASE}/api/preview?id=${giftId}`;

        // The actual gift page
        const currentFolder = window.location.protocol === 'file:'
            ? 'https://sudenzkrsvrnn-max.github.io/sude-hediye'
            : window.location.origin + window.location.pathname.replace(/\/[^/]+$/, '');
        const targetUrl = currentFolder + '/lovebombing.html?id=' + giftId;

        // ── Button targets ────────────────────────────────────────────────
        document.getElementById('open-link').href = targetUrl;

        const waMsg  = `💝 Sana özel bir hediye hazırladım!\n\nGörmek için tıkla 👇\n${shareUrl}`;
        const smsMsg = `💝 Sana özel bir hediye var! Görmek için tıkla: ${shareUrl}`;

        document.getElementById('share-wa').href =
            `https://wa.me/?text=${encodeURIComponent(waMsg)}`;

        document.getElementById('share-sms').href =
            `sms:?&body=${encodeURIComponent(smsMsg)}`;

        // Instagram: can't deep-link a DM, so copy to clipboard instead
        document.getElementById('share-ig').addEventListener('click', function(e) {
            e.preventDefault();
            const igMsg = `💝 Sana özel bir hediye hazırladım! 🎁\n\n${shareUrl}`;
            navigator.clipboard.writeText(igMsg).then(() => {
                this.textContent = '✅ Kopyalandı!';
                setTimeout(() => {
                    this.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg> IG için Kopyala`;
                }, 2200);
            });
        });

        function copyLink(btn) {
            navigator.clipboard.writeText(shareUrl).then(() => {
                btn.textContent = '✅ Kopyalandı!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Linki Kopyala';
                    btn.classList.remove('copied');
                }, 2200);
            }).catch(() => {
                // Fallback for non-HTTPS
                const ta = document.createElement('textarea');
                ta.value = shareUrl;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✅ Kopyalandı!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Linki Kopyala';
                    btn.classList.remove('copied');
                }, 2200);
            });
        }

        // ── Generate Heart QR Code ────────────────────────────────────────
        const qrHidden = document.getElementById('qr-hidden');
        new QRCode(qrHidden, {
            text: shareUrl,        // QR points to the Vercel preview (with OG tags)
            width: 256,
            height: 256,
            colorDark:  '#ff0000',
            colorLight: '#000000',
            correctLevel: QRCode.CorrectLevel.H
        });

        window.onload = function() {
            setTimeout(() => {
                const qrImg  = qrHidden.querySelector('img');
                const canvas = document.getElementById('qr-canvas');
                const ctx    = canvas.getContext('2d');

                canvas.width  = 512;
                canvas.height = 512;

                // Draw QR onto temp canvas first
                const tmp = document.createElement('canvas');
                tmp.width = tmp.height = 512;
                const tCtx = tmp.getContext('2d');
                tCtx.drawImage(qrImg, 0, 0, 512, 512);

                // Heart clip path
                const cx = 256, cy = 256, r = 220;
                ctx.beginPath();
                ctx.moveTo(cx, cy + r * 0.82);
                ctx.bezierCurveTo(cx, cy + r * 0.82, cx - r * 1.05, cy + r * 0.36, cx - r * 1.05, cy - r * 0.28);
                ctx.bezierCurveTo(cx - r * 1.05, cy - r * 0.82, cx - r * 0.52, cy - r * 1.0, cx, cy - r * 0.52);
                ctx.bezierCurveTo(cx + r * 0.52, cy - r * 1.0, cx + r * 1.05, cy - r * 0.82, cx + r * 1.05, cy - r * 0.28);
                ctx.bezierCurveTo(cx + r * 1.05, cy + r * 0.36, cx, cy + r * 0.82, cx, cy + r * 0.82);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(tmp, 0, 0);
            }, 500);
        };
    </script>
</body>
</html>
