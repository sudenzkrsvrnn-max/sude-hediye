<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- WhatsApp / Instagram / SMS Preview Tags -->
    <title>Sana Özel Bir Hediye Var! 💝</title>
    <meta name="description" content="Senin için hazırlanan bu özel sürprizi görmek için QR kodu tara veya linke tıkla.">
    <meta property="og:title" content="Sana Özel Bir Hediye Var! 💝">
    <meta property="og:description" content="Senin için hazırlanan bu özel sürprizi görmek için QR kodu tara veya linke tıkla.">
    <meta property="og:image" content="https://ymkfyaurdgfvdhkkpqam.supabase.co/storage/v1/object/public/assets/lovebombing.jpeg">
    <meta property="og:type" content="website">
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --primary: #ff1493;
            --accent: #ff0000;
            --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Background Glow */
        .bg-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255, 20, 147, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        /* Gift Box Container */
        .gift-container {
            position: relative;
            width: min(90vw, 450px);
            aspect-ratio: 1;
            background: var(--card-bg);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-shadow: 0 30px 100px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            animation: containerFloat 6s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-20px) rotateX(5deg); }
        }

        /* Red Ribbon Overlay */
        .ribbon-vertical {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 100%;
            background: linear-gradient(to bottom, #d40000, #ff0000, #d40000);
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            z-index: 1;
        }

        .ribbon-horizontal {
            position: absolute;
            left: 0;
            top: 20%;
            width: 100%;
            height: 50px;
            background: linear-gradient(to right, #d40000, #ff0000, #d40000);
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            z-index: 1;
        }

        .bow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            z-index: 5;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* QR Area */
        .qr-wrapper {
            position: relative;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.2);
            margin-top: 40px;
        }

        #qr-canvas {
            display: block;
            width: 250px;
            height: 250px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        .gift-title {
            position: relative;
            z-index: 10;
            margin-top: 30px;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gift-desc {
            position: relative;
            z-index: 10;
            margin-top: 10px;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            text-align: center;
        }

        /* Signature */
        .signature {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 10;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 20px;
            opacity: 0.8;
        }

        .signature span {
            display: block;
            font-size: 10px;
            font-family: 'Outfit', sans-serif;
            font-style: normal;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary);
        }

        /* Buttons */
        .action-btns {
            position: fixed;
            bottom: 40px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: #fff; color: #000; }
        .btn-wa { background: #25D366; color: #fff; }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        #qr-hidden { display: none; }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="gift-container">
        <div class="ribbon-vertical"></div>
        <div class="ribbon-horizontal"></div>
        
        <img src="https://ymkfyaurdgfvdhkkpqam.supabase.co/storage/v1/object/public/assets/bow.png" class="bow" alt="Bow" onerror="this.src='https://pngimg.com/uploads/red_ribbon/red_ribbon_PNG8114.png'">

        <div class="qr-wrapper">
            <canvas id="qr-canvas"></canvas>
        </div>

        <h1 class="gift-title">Sana Bir Hediye Var</h1>
        <p class="gift-desc">QR Kodu tara veya butona tıkla</p>

        <div class="signature">
            Gift<span>BY SUDE</span>
        </div>
    </div>

    <div class="action-btns">
        <button onclick="copyLink()" class="btn btn-primary">Linki Kopyala 📋</button>
        <a href="#" id="open-link" class="btn btn-primary" style="background: var(--primary); color: #fff;">Hediyeyi Aç ✨</a>
        <a href="#" id="share-wa" class="btn btn-wa">WhatsApp'ta Paylaş</a>
    </div>

    <div id="qr-hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const giftId = urlParams.get('id') || 'demo';
        const targetUrl = window.location.origin + '/lovebombing.html?id=' + giftId;

        // Set buttons
        document.getElementById('open-link').href = targetUrl;
        document.getElementById('share-wa').href = `https://wa.me/?text=${encodeURIComponent('Sana özel bir hediye hazırladım! 💝 Görmek için tıkla: ' + window.location.href)}`;

        // Generate QR Code
        const qrHidden = document.getElementById('qr-hidden');
        new QRCode(qrHidden, {
            text: targetUrl,
            width: 256,
            height: 256,
            colorDark: "#ff0000",
            colorLight: "#000000",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Draw Heart QR on Canvas
        window.onload = function() {
            setTimeout(() => {
                const qrImg = qrHidden.querySelector('img');
                const canvas = document.getElementById('qr-canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 512;
                canvas.height = 512;

                // Create a temporary canvas for the QR
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 512;
                tempCanvas.height = 512;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.drawImage(qrImg, 0, 0, 512, 512);

                // Heart Clipping Path (More accurate heart)
                ctx.beginPath();
                const d = 512;
                const x = d / 2;
                const y = d / 2;
                
                // Mathematical heart path
                ctx.moveTo(x, y + 180);
                ctx.bezierCurveTo(x, y + 180, x - 250, y + 50, x - 250, y - 100);
                ctx.bezierCurveTo(x - 250, y - 250, x - 50, y - 250, x, y - 100);
                ctx.bezierCurveTo(x + 50, y - 250, x + 250, y - 250, x + 250, y - 100);
                ctx.bezierCurveTo(x + 250, y + 50, x, y + 180, x, y + 180);
                ctx.closePath();
                ctx.clip();

                // Draw QR into the heart clip
                ctx.drawImage(tempCanvas, 0, 0);
            }, 500);
        };

        function copyLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Link kopyalandı! ✨");
        }
    </script>
</body>
</html>
