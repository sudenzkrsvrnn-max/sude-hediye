<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli | Gülümse Diye</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --primary: #ff1493;
            --primary-light: #ff69b4;
            --text: #ffffff;
            --gray: #a0a0a0;
            --card-bg: rgba(255,255,255,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        /* ── LOGIN ── */
        #loginOverlay {
            position: fixed; inset: 0; background: #050505;
            z-index: 1000; display: flex; align-items: center;
            justify-content: center; flex-direction: column; gap: 20px;
            padding: 24px;
        }
        #loginOverlay h1 { font-size: clamp(22px,6vw,28px); font-weight: 800; color: var(--primary); text-align:center; }
        #loginOverlay p  { color: var(--gray); font-size: 14px; text-align:center; }
        #adminPass {
            padding: 15px 20px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); color: white;
            width: min(280px,90vw); text-align: center; font-size: 18px;
            font-family: 'Outfit', sans-serif; letter-spacing: 4px; outline: none;
        }
        #adminPass:focus { border-color: var(--primary); }
        #loginBtn {
            padding: 14px 50px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; font-family: 'Outfit', sans-serif; transition: 0.3s;
            width: min(280px,90vw);
        }
        #loginBtn:hover { background: var(--primary-light); transform: translateY(-2px); }
        #loginError { color: #ff4444; font-size: 13px; display: none; }

        /* ── HEADER ── */
        header {
            display: flex; flex-wrap: wrap; gap: 14px;
            justify-content: space-between; align-items: center;
            margin-bottom: 24px; padding-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-size: 18px; font-weight: 800; color: var(--primary); }

        .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .stat-card {
            background: var(--card-bg); padding: 10px 18px;
            border-radius: 12px; text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--primary-light); }
        .stat-label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }

        #refreshBtn {
            padding: 10px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); color: var(--gray);
            border-radius: 10px; cursor: pointer; font-family: 'Outfit', sans-serif;
            font-size: 13px; transition: 0.3s; white-space: nowrap;
        }
        #refreshBtn:hover { border-color: var(--primary); color: white; }

        /* ── STATUS MSG ── */
        #statusMsg { text-align: center; padding: 50px; color: var(--gray); font-size: 15px; }
        .empty-icon { font-size: 48px; display: block; margin-bottom: 15px; }

        /* ══════════════════════════════════════════
           DESKTOP TABLE (≥ 768px)
        ══════════════════════════════════════════ */
        .table-container {
            background: var(--card-bg); border-radius: 20px;
            overflow-x: auto; border: 1px solid rgba(255,255,255,0.05);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
        th {
            background: rgba(255,255,255,0.03); padding: 16px 18px;
            font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px;
            white-space: nowrap;
        }
        td { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 13px; vertical-align: top; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        /* ══════════════════════════════════════════
           MOBILE CARDS (< 768px)
        ══════════════════════════════════════════ */
        .card-list { display: none; flex-direction: column; gap: 14px; }

        .gift-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-top {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
        }
        .card-id-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .card-date { font-size: 11px; color: var(--gray); text-align: right; flex-shrink: 0; }

        .card-body { display: flex; flex-direction: column; gap: 6px; }
        .card-label { font-size: 10px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        .card-value { font-size: 14px; font-weight: 600; }

        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-field { display: flex; flex-direction: column; gap: 3px; }

        /* Link box & Actions */
        .link-box { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }

        .share-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .share-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px; border-radius: 12px; border: none;
            font-size: 13px; font-weight: 700; cursor: pointer;
            font-family: 'Outfit', sans-serif; transition: 0.2s;
            text-decoration: none; color: #fff;
        }
        .share-btn:active { transform: scale(0.96); }
        .btn-info  { background: rgba(255,255,255,0.1); }
        .btn-info:hover { background: rgba(255,255,255,0.15); }
        .btn-share { background: #0a84ff; }
        .btn-share:hover { background: #0070e0; }
        .btn-copy  { background: rgba(255,20,147,0.15); color: var(--primary-light); border: 1px solid rgba(255,20,147,0.3); }
        .btn-copy:hover { background: rgba(255,20,147,0.25); }
        .btn-copy.copied { background: rgba(0,200,100,0.2); border-color: #44cc88; color: #44cc88; }
        .btn-open  { background: linear-gradient(135deg, var(--primary), var(--primary-light)); }
        .btn-open:hover { opacity: 0.9; }

        .date { color: var(--gray); font-size: 12px; }
        .msg-cell { font-weight: 600; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* MODAL */
        #infoModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #111; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; position: relative;
        }
        .modal-close {
            position: absolute; top: 16px; right: 20px; background: none; border: none;
            color: var(--gray); font-size: 24px; cursor: pointer; transition: 0.2s;
        }
        .modal-close:hover { color: #fff; }
        .modal-title { font-size: 18px; margin-bottom: 20px; color: var(--primary-light); display:flex; align-items:center; gap:8px; }
        .info-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .info-label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        .info-value { font-size: 14px; color: #fff; background: rgba(255,255,255,0.03); padding: 10px 12px; border-radius: 10px; word-break: break-word; }

        /* ── Responsive breakpoint ── */
        @media (max-width: 767px) {
            body { padding: 14px; }

            .table-container { display: none; }
            .card-list { display: flex; }

            header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-right { width: 100%; justify-content: space-between; }
            .stat-card { flex: 1; }
        }

        @media (max-width: 400px) {
            .share-btns { flex-direction: column; }
            .share-btn, .copy-btn, .btn-view { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
    <h1>💝 GÜLÜMSE DİYE</h1>
    <p>Admin Paneli — Sadece yetkili erişim</p>
    <input type="password" id="adminPass" placeholder="••••••••" autofocus>
    <button id="loginBtn" onclick="checkPass()">Giriş Yap</button>
    <span id="loginError">❌ Yanlış şifre!</span>
</div>

<!-- DASHBOARD -->
<header>
    <div class="logo">📊 Admin Dashboard</div>
    <div class="header-right">
        <button id="refreshBtn" onclick="loadSubmissions()">↻ Yenile</button>
        <div class="stat-card">
            <div class="stat-value" id="totalCount">—</div>
            <div class="stat-label">Toplam</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="activeCount">—</div>
            <div class="stat-label">Aktif</div>
        </div>
    </div>
</header>

<!-- DESKTOP TABLE -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Tarih</th>
                <th>ID</th>
                <th>Durum</th>
                <th>Mesaj</th>
                <th>Anı</th>
                <th>Link &amp; Paylaş</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div id="statusMsg"><span class="empty-icon">⏳</span>Veriler yükleniyor...</div>
</div>

<!-- MOBILE CARD LIST -->
<div class="card-list" id="cardList"></div>
<div id="statusMsgMobile" style="display:none; text-align:center; padding:50px; color:var(--gray); font-size:15px;"></div>

<!-- CUSTOMER INFO MODAL -->
<div id="infoModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h2 class="modal-title">👁️ Müşteri Bilgileri</h2>
        <div id="modalBody"></div>
    </div>
</div>

<script>
    const ADMIN_PASS = "admin123";
    const BASE_URL = window.location.protocol === 'file:' || window.location.hostname.includes('github.io')
        ? "https://sude-hediye-cfhmqnvrg-sudenzkrsvrnn-maxs-projects.vercel.app"
        : window.location.origin;

    document.getElementById('adminPass').addEventListener('keydown', e => {
        if (e.key === 'Enter') checkPass();
    });

    function checkPass() {
        const val = document.getElementById('adminPass').value;
        if (val === ADMIN_PASS) {
            document.getElementById('loginOverlay').style.display = 'none';
            initSupabaseAndLoad();
        } else {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminPass').focus();
        }
    }

    const SUPABASE_URL = "https://ymkfyaurdgfvdhkkpqam.supabase.co";
    const SUPABASE_KEY = "sb_publishable_y2Txq9nCopsoNAR8aSKL3g_hjuCT8n_";
    let sb = null;

    function initSupabaseAndLoad() {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        script.onload = () => {
            sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            loadSubmissions();
        };
        script.onerror = () => {
            document.getElementById('statusMsg').innerHTML = '<span class="empty-icon">❌</span>Supabase yüklenemedi.';
        };
        document.head.appendChild(script);
    }

    let allSubmissions = [];

    async function loadSubmissions() {
        document.getElementById('statusMsg').style.display = 'block';
        document.getElementById('statusMsg').innerHTML = '<span class="empty-icon">⏳</span>Veriler yükleniyor...';
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('cardList').innerHTML = '';
        if (!sb) return;
        try {
            const { data, error } = await sb
                .from('submissions')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;
            allSubmissions = data || [];
            renderTable(allSubmissions);
            renderCards(allSubmissions);
        } catch (err) {
            document.getElementById('statusMsg').innerHTML = `<span class="empty-icon">❌</span>Hata: ${err.message}`;
        }
    }

    function openModal(index) {
        const item = allSubmissions[index];
        const statusText = item.customer_info && item.customer_info.includes('Demo') ? '⏳ Demo / Ödeme Bekliyor' : '✅ Aktif / Ödendi';
        
        document.getElementById('modalBody').innerHTML = `
            <div class="info-row"><span class="info-label">Sipariş ID</span><span class="info-value">#${item.id_custom || '—'}</span></div>
            <div class="info-row"><span class="info-label">Durum</span><span class="info-value">${statusText}</span></div>
            <div class="info-row"><span class="info-label">Gönderen</span><span class="info-value">${item.sender_name || 'Bilinmiyor'}</span></div>
            <div class="info-row"><span class="info-label">Alıcı</span><span class="info-value">${item.recipient_name || 'Bilinmiyor'}</span></div>
            <div class="info-row"><span class="info-label">İletişim / Müşteri Notu</span><span class="info-value">${item.customer_info || '—'}</span></div>
        `;
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    // Close modal on outside click
    window.onclick = function(event) {
        const modal = document.getElementById('infoModal');
        if (event.target === modal) closeModal();
    }

    /* ── DESKTOP TABLE ── */
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        document.getElementById('totalCount').textContent = data.length;
        const activeOrders = data.filter(d => d.customer_info && !d.customer_info.includes('Demo'));
        document.getElementById('activeCount').textContent = activeOrders.length;

        if (data.length === 0) {
            document.getElementById('statusMsg').innerHTML = '<span class="empty-icon">🔭</span>Henüz hiç başvuru yok.';
            return;
        }
        document.getElementById('statusMsg').style.display = 'none';
        tbody.innerHTML = '';

        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            const date = item.created_at ? new Date(item.created_at).toLocaleString('tr-TR') : '—';
            const memCount = Array.isArray(item.memories) ? item.memories.length : 0;
            const giftUrl = `${BASE_URL}/api/preview?id=${item.id_custom}`;
            const isDemo = item.customer_info && item.customer_info.includes('Demo');
            const statusBadge = isDemo
                ? `<span class="badge-demo">⏳ Demo</span>`
                : `<span class="badge-active">✅ Aktif</span>`;

            tr.innerHTML = `
                <td class="date">${date}</td>
                <td><span class="badge-id">#${item.id_custom || '—'}</span></td>
                <td>${statusBadge}</td>
                <td class="msg-cell" title="${item.matrix_message || ''}">${item.matrix_message || '—'}</td>
                <td>${memCount} 📸</td>
                <td>
                    <div class="share-btns" style="display:flex;">
                        <button class="share-btn btn-share" onclick="nativeShare('${giftUrl}')">📤 Paylaş</button>
                        <button class="share-btn btn-copy" onclick="copyLink(this,'${giftUrl}')">📋 Kopyala</button>
                    </div>
                </td>
                <td>
                    <div class="share-btns" style="display:flex;">
                        <button class="share-btn btn-info" onclick="openModal(${index})">👁️ Detay</button>
                        <a href="${giftUrl}" target="_blank" class="share-btn btn-open">🎁 Aç ↗</a>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    /* ── MOBILE CARDS ── */
    function renderCards(data) {
        const list = document.getElementById('cardList');
        list.innerHTML = '';

        if (data.length === 0) return;

        data.forEach((item, index) => {
            const date = item.created_at
                ? new Date(item.created_at).toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' })
                : '—';
            const memCount = Array.isArray(item.memories) ? item.memories.length : 0;
            const giftUrl = `${BASE_URL}/api/preview?id=${item.id_custom}`;
            const isDemo = item.customer_info && item.customer_info.includes('Demo');
            const statusBadge = isDemo
                ? `<span class="badge-demo">⏳ Demo</span>`
                : `<span class="badge-active">✅ Aktif</span>`;

            const card = document.createElement('div');
            card.className = 'gift-card';
            card.innerHTML = `
                <div class="card-top">
                    <div class="card-id-status">
                        <span class="badge-id">#${item.id_custom || '—'}</span>
                        ${statusBadge}
                    </div>
                    <div class="card-date">🕐 ${date}</div>
                </div>

                <div class="card-row">
                    <div class="card-field">
                        <span class="card-label">Mesaj</span>
                        <span class="card-value" style="font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                              title="${item.matrix_message || ''}">${item.matrix_message || '—'}</span>
                    </div>
                    <div class="card-field">
                        <span class="card-label">Anı</span>
                        <span class="card-value">${memCount} 📸</span>
                    </div>
                </div>

                <div class="link-box">
                    <div class="share-btns">
                        <button class="share-btn btn-info" onclick="openModal(${index})">👁️ Müşteri Bilgisi</button>
                        <button class="share-btn btn-share" onclick="nativeShare('${giftUrl}')">📤 Linki Paylaş</button>
                        <button class="share-btn btn-copy" onclick="copyLink(this,'${giftUrl}')">📋 Kopyala</button>
                        <a href="${giftUrl}" target="_blank" class="share-btn btn-open">🎁 Aç ↗</a>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function nativeShare(url) {
        if (navigator.share) {
            navigator.share({
                title: 'Sana Özel Bir Süpriz Var! 💝',
                text: '💝 Sana özel bir hediye hazırladım! Görmek için tıkla 👇\n',
                url: url
            }).catch((err) => {
                console.log('Share error:', err);
            });
        } else {
            // Fallback
            copyLink(null, url);
            alert('Link kopyalandı! İstediğiniz platformda yapıştırıp paylaşabilirsiniz.');
        }
    }

    function copyLink(btn, url) {
        navigator.clipboard.writeText(url).then(() => {
            if(btn) {
                const oldText = btn.textContent;
                btn.textContent = '✅';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = oldText; btn.classList.remove('copied'); }, 2000);
            }
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = url; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
            if(btn) {
                const oldText = btn.textContent;
                btn.textContent = '✅'; btn.classList.add('copied');
                setTimeout(() => { btn.textContent = oldText; btn.classList.remove('copied'); }, 2000);
            }
        });
    }


</script>

</body>
</html>
