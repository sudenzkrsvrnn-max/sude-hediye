<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emoji Test</title>
    <script src="https://unpkg.com/twemoji@14.0.2/dist/twemoji.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            twemoji.parse(document.body, {
                base: 'https://unpkg.com/emoji-datasource-apple@15.0.1/img/apple/',
                size: '64',
                ext: '.png'
            });
        });
    </script>
    <style>
        img.emoji { height: 2em; width: 2em; }
    </style>
</head>
<body>
    <div id="test">
        Hello World! ❤️ ✨ 💝 📖
    </div>
</body>
</html>
